Resources:

  # 1. MAQUINAS
  MaquinaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${sls:stage}-t_maquina
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: machine_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: machine_id
          KeyType: RANGE

  # 2. ANOMALIAS
  AnomaliasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${sls:stage}-t_anomalias
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: tenant-timestamp-index
          KeySchema:
            - AttributeName: tenant_id
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 3. PATRONES
