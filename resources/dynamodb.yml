Resources:

  # 1. MACHINES
  MaquinaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${sls:stage}-t_machines
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: machine_id
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: machine_id
          KeyType: RANGE

  # 2. ANOMALIES
  AnomaliasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${sls:stage}-t_anomalies
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: tenant-timestamp-index
          KeySchema:
            - AttributeName: tenant_id
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 3. PATTERNS
  PatronesTable:
    Type: AWS::DynamoDB::Table
    Properties:
